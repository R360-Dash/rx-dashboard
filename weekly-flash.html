<!DOCTYPE html>
<html lang="en">
<head>

<title>Weekly Flash Report · RacquetX</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #F0F4F3; color: #0D2B29; }

  .report-header {
    background: linear-gradient(135deg, #0D2B29 0%, #1B4D4A 60%, #2A6B65 100%);
    color: #fff; padding: 28px 48px 26px;
    display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 16px;
  }
  .report-header .left .badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2);
    border-radius: 20px; padding: 3px 10px; font-size: 11px; font-weight: 600;
    letter-spacing: .06em; text-transform: uppercase; color: #A8D5CF; margin-bottom: 10px;
  }
  .report-header h1 { font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
  .report-header .subtitle { font-size: 13px; color: #A8D5CF; margin-top: 4px; }
  .report-header .sync { font-size: 11px; color: rgba(255,255,255,.4); margin-top: 14px; }
  .report-header .right { text-align: right; }

  .content { max-width: 1060px; margin: 0 auto; padding: 32px 24px 60px; }

  /* Loading */
  .loading-state { background:#fff;border-radius:12px;padding:40px;text-align:center;box-shadow:0 1px 6px rgba(27,77,74,.07);margin-bottom:24px; }
  .spinner { width:28px;height:28px;border:3px solid #D4E2DD;border-top-color:#3D9B8F;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* Section */
  .sec-title { font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#7BA69E;margin-bottom:10px;margin-top:24px; }

  /* Two-col grid */

  /* KPI mini grid */

  .kpi-mini { background:#F6FAF9;border-radius:8px;padding:12px 14px; }
  .kpi-mini .lbl { font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#7BA69E;margin-bottom:4px; }
  .kpi-mini .val { font-size:20px;font-weight:800;color:#0D2B29;letter-spacing:-.02em; }
  .kpi-mini .sub { font-size:11px;color:#9BB5B1;margin-top:2px; }
  .kpi-mini.accent { background:linear-gradient(135deg,#1B4D4A,#3D9B8F); }
  .kpi-mini.accent .lbl { color:rgba(255,255,255,.6); }
  .kpi-mini.accent .val { color:#fff; }
  .kpi-mini.accent .sub { color:rgba(255,255,255,.5); }

  /* Attainment bar */
  .att-row { display:flex;align-items:center;gap:10px;margin-bottom:10px; }
  .att-label { font-size:12px;font-weight:600;color:#2A4E4A;min-width:56px; }
  .att-bar-bg { flex:1;height:8px;background:#EDF2F1;border-radius:4px;overflow:hidden; }
  .att-bar-fill { height:100%;border-radius:4px;transition:width .5s; }
  .att-nums { font-size:11px;min-width:140px;text-align:right;color:#5A8A84; }
  .att-pct  { font-size:12px;font-weight:700;min-width:38px;text-align:right; }

  /* Pipeline stage list */
  .stage-list { display:flex;flex-direction:column;gap:0; }
  .stage-item { display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #F0F6F4; }
  .stage-item:last-child { border-bottom:none; }
  .s-dot { width:8px;height:8px;border-radius:50%;flex-shrink:0; }
  .s-name { font-size:13px;font-weight:600;flex:1;color:#2A4E4A; }
  .s-prob { font-size:10px;font-weight:700;padding:2px 5px;border-radius:3px;min-width:30px;text-align:center; }
  .s-ct   { font-size:12px;color:#7BA69E;min-width:50px;text-align:right; }
  .s-raw  { font-size:13px;font-weight:700;color:#0D2B29;min-width:80px;text-align:right; }
  .s-wtd  { font-size:12px;color:#3D9B8F;min-width:70px;text-align:right; }
  .stage-total { display:flex;align-items:center;gap:10px;padding:10px 0 0;border-top:2px solid #D4E2DD;margin-top:4px; }

  /* SVG bar chart */
  .chart-wrap { width:100%;overflow:hidden; }
  .bar-chart-svg { width:100%;display:block; }
  .chart-note { font-size:10px;color:#9BB5B1;margin-top:6px;text-align:center; }

  /* Cash cards */
  .cash-kpis { display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px; }
  @media(max-width:600px){ .cash-kpis { grid-template-columns:1fr 1fr; } }

  /* Flag banner */
  .flag-banner { border-radius:12px; padding:18px 22px; margin-bottom:24px; display:flex; align-items:flex-start; gap:16px; }
  .flag-banner.red    { background:#FFF0EE; border:2px solid #E74C3C; }
  .flag-banner.amber  { background:#FFFBF0; border:2px solid #F39C12; }
  .flag-banner.green  { background:#F0FAF4; border:2px solid #1B7A3D; }
  .flag-icon  { font-size:28px; flex-shrink:0; line-height:1; }
  .flag-body  {}
  .flag-title { font-size:15px; font-weight:800; margin-bottom:4px; }
  .flag-banner.red    .flag-title { color:#C0392B; }
  .flag-banner.amber  .flag-title { color:#B8860B; }
  .flag-banner.green  .flag-title { color:#1B7A3D; }

  .flag-detail strong { font-weight:700; }

  /* Divider */
  .divider { height:1px;background:#E0ECEB;margin:24px 0; }

  /* Footer */
  .report-footer { text-align:center;font-size:11px;color:#9BB5B1;padding-top:20px;border-top:1px solid #E0ECEB;margin-top:8px; }
  .tag-live { background:#D4F0E8;color:#1B6B55;font-size:10px;font-weight:700;border-radius:4px;padding:2px 6px; }
</style>

<body>

<div style="background:linear-gradient(135deg,#0D2B29 0%,#1B4D4A 60%,#2A6B65 100%);color:#fff;padding:28px 48px 26px;display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:16px">
  <div>
    <div style="display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#A8D5CF;margin-bottom:10px">⚡ Weekly Flash · Confidential</div>

<div style="max-width:1060px;margin:0 auto;padding:32px 24px 60px" id="reportContent">
  <div style="background:#fff;border-radius:12px;padding:40px;text-align:center;margin-bottom:24px">
    <p style="font-size:13px;color:#7BA69E">Fetching live data from HubSpot &amp; QuickBooks…</p>

<script>
// ── Config ─────────────────────────────────────────────────────────────────
const HS_PROXY  = 'https://racquetx-hubspot-proxy.racquetx.workers.dev/api/deals';
const QBO_BASE  = 'https://racquetx-qbo-proxy.racquetx.workers.dev';
const QBO_YEAR  = 2026;

// SC2027 quotas — index 0=Apr'26 … 11=Mar'27
const Q_SHOW = [100000,250000,80000,80000,75000,120000,160000,180000,250000,180000,190000,35000];
const Q_CS   = [0,70500,30000,30000,19500,0,0,0,0,0,0,0];
const MO_LBL = ["Apr'26","May'26","Jun'26","Jul'26","Aug'26","Sep'26","Oct'26","Nov'26","Dec'26","Jan'27","Feb'27","Mar'27"];

const STAGE_CFG = {
  '101597223':           {prob:0.85, label:'Contract Sent',    color:'#1B7A3D'},
  '101597222':           {prob:0.55, label:'Negotiating',       color:'#3D9B8F'},
  'presentationscheduled':{prob:0.30, label:'Qualified Meeting',color:'#B8860B'},
  'appointmentscheduled': {prob:0.10, label:'Contact',          color:'#C0392B'},
  '1037013850':          {prob:0.00, label:'Non-Qualified',     color:'#9BB5B1'},
};

// ── Helpers ────────────────────────────────────────────────────────────────
function fmt$(v){
  if(v==null) return '—';
  const abs=Math.abs(v), sign=v<0?'-':'';
  if(abs>=1e6) return sign+'$'+(abs/1e6).toFixed(2)+'M';
  if(abs>=1e3) return sign+'$'+Math.round(abs/1e3).toLocaleString()+'K';
  return (v<0?'-':'')+'$'+Math.round(abs).toLocaleString();
}
const fmtFull = fmt$;  // all amounts in K$
const pct = (a,b) => b > 0 ? Math.min(Math.round(a/b*100), 999) : 0;
const ck  = n => n.split(' - ')[0].trim().toLowerCase();
const isRebook = d => d.r === 'Rebook' || d.n.toLowerCase().includes('rebook');
const isCsDeal = n => n.toLowerCase().includes('city series');

function sc27Idx(cd){
  if(!cd||cd.length<7) return -1;
  const yr=+cd.slice(0,4), mo=+cd.slice(5,7);
  if(yr===2026&&mo>=4) return mo-4;
  if(yr===2027&&mo<=3) return mo+8;
  return -1;
}
function curIdx(){
  const now=new Date(), yr=now.getFullYear(), mo=now.getMonth()+1;
  if(yr<2026||(yr===2026&&mo<4)) return 0;
  if(yr===2026&&mo>=4) return Math.min(mo-4,11);
  if(yr===2027&&mo<=3) return Math.min(mo+8,11);
  return 11;
}
function weekLabel(){
  const now = new Date();
  const d1  = new Date(now); d1.setDate(now.getDate() - now.getDay() + 1);
  const d2  = new Date(d1);  d2.setDate(d1.getDate() + 6);
  const fmt = d => d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  return `Week of ${fmt(d1)} – ${fmt(d2)}`;
}

// ── QBO account → CF category mapping (mirrors dashboard QBO_MAPPING) ────────
const WF_QBO_MAPPING = {"City Series Sales":"City Series Tickets","Rebooking Sales":"Show Sponsors","Revenue - Merch":"Merch","Sales - Clubs Summit":"City Series Sponsors","Sales - City Series Sponsorship":"City Series Sponsors","Sponsorship Sales":"Show Sponsors","Tickets Sales":"Show Tickets","COGS - City Series":"City Series Costs","Cost of Goods Sold":"Show Costs","Additional Staff":"Show Costs","Additional Staffing":"Show Costs","Big 6":"Show Costs","Speakers / T&E":"Show Costs","Sponsorships":"Show Costs","Staff T&E":"Show Costs","Venue":"Show Costs","AV Labor":"Show Costs","Booth Packages":"Show Costs","Catering":"Show Costs","Club Summit":"Show Costs","Creators Corner":"Show Costs","Decoration":"Show Costs","Digital signage":"Show Costs","Emerging Designers":"Show Costs","Evening Event Night Day 1":"Show Costs","Evening Event Night Day 2":"Show Costs","Freight":"Show Costs","Hotel & Accomodation":"Show Costs","Hotel Attrition":"Show Costs","Innovation Showcase":"Show Costs","Internet":"Show Costs","Keynote":"Show Costs","Pod Cast Studio":"Show Costs","Registration":"Show Costs","Show Decorator":"Show Costs","Showfloor Theater":"Show Costs","Signage":"Show Costs","Venue Rental":"Show Costs","Venue Costs / Staffing":"Show Costs","Travel COGS":"Show Costs","Stripe fees":"SG&A","Bank Charges":"SG&A","Contractors":"SG&A","Expense Reimbursement":"SG&A","Insurance":"SG&A","Interest Paid":"SG&A","Legal & Professional Services":"SG&A","Accounting Services":"SG&A","Consulting Fees":"SG&A","IT Services":"SG&A","Management Fees":"SG&A","Recruitment Fees":"SG&A","Tax Services":"SG&A","Licenses":"SG&A","Licenses & Dues":"SG&A","Marketing Expenses":"Marketing Costs","Audience Marketing":"Marketing Costs","Brand Marketing":"Marketing Costs","Marketing Partner":"Marketing Costs","Conference Content":"Marketing Costs","Sales Marketing":"Marketing Costs","SEM/SEO":"Marketing Costs","Social Media":"Marketing Costs","Merchant Fees":"SG&A","QuickBooks Payments Fees":"SG&A","Shipping, Freight & Delivery":"SG&A","Software & Apps Subscriptions":"SG&A","Travel":"SG&A","Uncategorized Expense":"SG&A","Commissions":"SG&A","Corporate Expense Allocation":"Corporate Expense Allocation","Exhange Rate Difference":"SG&A","Other Miscellaneous Expense":"SG&A","Suscriptions and fees":"SG&A","Team Meals":"SG&A","General Services Contractor":"Show Costs","Recovery Costs":"Show Costs"};

// ── CF Lines (must match dashboard schema) ────────────────────────────────
const CF_LINES = [
  { key:'showColl',     sign:+1 },
  { key:'csColl',       sign:+1 },
  { key:'ancillaryRev',  sign:+1 },
  { key:'ancillaryCosts',sign:-1 },
  { key:'showCosts',    sign:-1 },
  { key:'cityCosts',    sign:-1 },
  { key:'marketing',    sign:-1 },
  { key:'sga',          sign:-1 },
  { key:'contingencies',sign:-1 },
  { key:'salesComm',    sign:-1 },
];
function computeNetBurn(lineMap){
  return Array.from({length:12}, (_,i) => {
    let net=0;
    CF_LINES.forEach(l => { net += l.sign * (lineMap[l.key]?.[i] || 0); });
    return net;
  });
}
function computeScenario(forecastData, contingencyMult, netChanges, bankBals, beginCash, lastActIdx){
  if(!forecastData) return null;
  const mFc = {};
  CF_LINES.forEach(l => { mFc[l.key] = (forecastData[l.key] || []).slice(); });
  for(let i = lastActIdx+1; i < 12; i++){
    mFc.contingencies[i] = contingencyMult * (forecastData.contingencies?.[i] || 0);
  }
  const mBurns = Array(12).fill(0);
  for(let i = 0; i <= lastActIdx; i++) mBurns[i] = netChanges[i]||0;
  const future = computeNetBurn(mFc);
  for(let i = lastActIdx+1; i < 12; i++) mBurns[i] = future[i];
  const mCashPos = Array(12).fill(0);
  for(let i = 0; i < 12; i++){
    if(i <= lastActIdx) mCashPos[i] = bankBals[i]||0;
    else mCashPos[i] = (i===0?beginCash:mCashPos[i-1]) + mBurns[i];
  }
  const projYE = mCashPos[11];
  const runwayGoesNeg = mCashPos.slice(lastActIdx+1).some(v => v <= 0);
  let runwayMonths = null;
  for(let i=lastActIdx+1; i<12; i++){ if(mCashPos[i]<=0){ runwayMonths=i-lastActIdx; break; } }
  if(!runwayGoesNeg) runwayMonths = 12-lastActIdx-1;
  return { cashPos: mCashPos, forecastBurns: mBurns, projYearEnd: projYE, runwayGoesNeg, runwayMonths, cashNeededYE: projYE<0?Math.abs(projYE):0 };
}

// Trailing 3-month average with outlier filter — mirrors _cfTrailingAvg in dashboard
function cfTrailingAvg(arr, lastActIdx){
  if(lastActIdx < 0) return 0;
  const recent = arr.slice(Math.max(0, lastActIdx-2), lastActIdx+1).filter(v => Math.abs(v) > 0.01);
  if(!recent.length) return 0;
  const sorted = [...recent].sort((a,b) => Math.abs(a)-Math.abs(b));
  const med = sorted[Math.floor(sorted.length/2)];
  const filt = recent.filter(v => !med || Math.abs(v) <= Math.abs(med)*3);
  const use = filt.length ? filt : recent;
  return Math.round(use.reduce((s,v)=>s+v,0)/use.length);
}

// Parse P&L report → per-category monthly actuals using WF_QBO_MAPPING
function parsePlForCfLines(plReport){
  const empty = () => Array(12).fill(0);
  const cats = { showCosts: empty(), cityCosts: empty(), marketing: empty(), sga: empty() };
  if(!plReport?.Rows?.Row) return cats;
  const catKey = { 'Show Costs':'showCosts', 'City Series Costs':'cityCosts', 'Marketing Costs':'marketing', 'SG&A':'sga' };
  function addLeaf(label, monthly){
    const cat = WF_QBO_MAPPING[label];
    const key = catKey[cat];
    if(key) monthly.forEach((v,i) => { cats[key][i] += Math.abs(parseFloat(v)||0); });
  }
  function walkRow(r){
    if(r.ColData){
      const cd = r.ColData;
      addLeaf(cd[0]?.value||'', (cd.slice(1,-1).map(c=>parseFloat(c.value||0)||0)));
    } else if(r.Header && r.Rows){
      const hdr = r.Header.ColData||[];
      if(hdr.length > 1){
        const pm = hdr.slice(1,-1).map(c=>parseFloat(c.value||0)||0);
        if(pm.some(v=>v!==0)) addLeaf(hdr[0]?.value||'', pm);
      }
      (r.Rows.Row||[]).forEach(walkRow);
    }
  }
  (plReport.Rows.Row||[]).forEach(walkRow);
  return cats;
}

// ── QBO parsing ─────────────────────────────────────────────────────────────
function parseNetChanges(report){
  if(!report?.Rows) return Array(12).fill(0);
  const rows = report.Rows.Row || [];
  for(const r of rows){
    if(r.Summary){
      const cd  = r.Summary.ColData || [];
      const lbl = cd[0]?.value || '';
      if(/Net cash|Net Increase|Ending Cash|Net change/i.test(lbl)){
        return cd.slice(1,-1).map(c=>parseFloat(c.value||0)||0);
      }
    }
    if(r.Header && r.Rows){
      const sub = r.Summary?.ColData || [];
      const lbl = (sub[0]?.value || r.Header?.ColData?.[0]?.value || '');
      if(/Net cash|Net Increase/i.test(lbl)){
        return sub.slice(1,-1).map(c=>parseFloat(c.value||0)||0);
      }
    }
  }
  return Array(12).fill(0);
}
function extractBankBalances(bsReport){
  if(!bsReport?.Rows) return null;
  function find(node){
    if(node.Header && node.Rows){
      const lbl = node.Header.ColData?.[0]?.value || '';
      if(/^Bank Accounts$/i.test(lbl)){
        const cd = node.Summary?.ColData || [];
        return cd.slice(1,-1).map(c=>parseFloat(c.value||0)||0);
      }
      for(const sub of (node.Rows.Row||[])){ const r=find(sub); if(r) return r; }
    }
    return null;
  }
  for(const r of (bsReport.Rows.Row||[])){ const f=find(r); if(f) return f; }
  return null;
}

// ── SVG bar chart ──────────────────────────────────────────────────────────
function svgBars(data, opts={}){
  const W = opts.w || 600, H = opts.h || 120;
  const pad = { t:8, b:32, l:44, r:8 };
  const bW  = opts.barW || Math.max(4, Math.floor((W - pad.l - pad.r) / data.length * 0.65));
  const gap  = (W - pad.l - pad.r) / data.length;
  const maxAbs = Math.max(...data.map(d=>Math.abs(d.v)), 1);
  const zeroY  = pad.t + (H - pad.t - pad.b) / 2;
  const scaleY = (H - pad.t - pad.b) / 2 / maxAbs;

  let bars = '', labels = '', vals = '';

  data.forEach((d, i) => {
    const x    = pad.l + gap * i + (gap - bW) / 2;
    const barH = Math.abs(d.v) * scaleY;
    const y    = d.v >= 0 ? zeroY - barH : zeroY;
    const col  = d.v >= 0 ? (opts.posColor || '#1B7A3D') : (opts.negColor || '#C0392B');
    const lbl  = d.label || '';
    const valY = d.v >= 0 ? y - 3 : y + barH + 11;
    bars   += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bW}" height="${Math.max(barH,1).toFixed(1)}" fill="${col}" rx="2"/>`;
    labels += `<text x="${(x+bW/2).toFixed(1)}" y="${(H-pad.b+14).toFixed(1)}" text-anchor="middle" font-size="9" fill="#9BB5B1">${lbl}</text>`;
    if(Math.abs(d.v) > 0){
      vals += `<text x="${(x+bW/2).toFixed(1)}" y="${valY.toFixed(1)}" text-anchor="middle" font-size="8" fill="${col}" font-weight="600">${d.v>=0?'+':''}${fmt$(d.v).replace('$','').trim()}</text>`;
    }
  });

  // Zero line
  const zLine = `<line x1="${pad.l}" y1="${zeroY.toFixed(1)}" x2="${W-pad.r}" y2="${zeroY.toFixed(1)}" stroke="#D4E2DD" stroke-width="1"/>`;
  // Y-axis labels
  const yLabels = [-maxAbs, 0, maxAbs].map(v => {
    const y = zeroY - v * scaleY;
    return `<text x="${(pad.l-4).toFixed(1)}" y="${y.toFixed(1)}" text-anchor="end" font-size="9" fill="#9BB5B1" dominant-baseline="middle">${fmt$(v)}</text>`;
  }).join('');

  return `<svg class="bar-chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    ${yLabels}${zLine}${bars}${labels}${vals}
  </svg>`;
}

// ── SVG bar chart — actuals solid, forecast hatched ───────────────────────
function svgBarsActVsForecast(data, opts={}){
  const W=600, H=opts.h||120;
  const pad={t:8,b:28,l:48,r:8};
  const gap=(W-pad.l-pad.r)/data.length;
  const bW=Math.max(4, Math.floor(gap*0.62));
  const vals=data.map(d=>d.v);
  const maxAbs=Math.max(...vals.map(Math.abs),1);
  const hasNeg=vals.some(v=>v<0);
  const zeroY = hasNeg ? pad.t+(H-pad.t-pad.b)/2 : H-pad.b;
  const scaleY = hasNeg ? (H-pad.t-pad.b)/2/maxAbs : (H-pad.t-pad.b)/maxAbs;

  // Stripe pattern for forecast bars
  const defs=`<defs>
    <pattern id="stripe-pos" patternUnits="userSpaceOnUse" width="4" height="4">
      <path d="M-1,1 l2,-2 M0,4 l4,-4 M3,5 l2,-2" stroke="#1B7A3D" stroke-width="1.2" opacity=".45"/>
    </pattern>
    <pattern id="stripe-neg" patternUnits="userSpaceOnUse" width="4" height="4">
      <path d="M-1,1 l2,-2 M0,4 l4,-4 M3,5 l2,-2" stroke="#C0392B" stroke-width="1.2" opacity=".45"/>
    </pattern>
    <pattern id="stripe-blue" patternUnits="userSpaceOnUse" width="4" height="4">
      <path d="M-1,1 l2,-2 M0,4 l4,-4 M3,5 l2,-2" stroke="#3D9B8F" stroke-width="1.2" opacity=".45"/>
    </pattern>
  </defs>`;

  let bars='', labels='', vLabels='', gridLines='';
  // Y-axis
  const yTicks = hasNeg ? [-maxAbs,0,maxAbs] : [0, maxAbs/2, maxAbs];
  yTicks.forEach(v=>{
    const y=zeroY-v*scaleY;
    gridLines+=`<line x1="${pad.l}" y1="${y.toFixed(1)}" x2="${W-pad.r}" y2="${y.toFixed(1)}" stroke="#EDF2F1" stroke-width="1"/>`;
    gridLines+=`<text x="${(pad.l-4).toFixed(1)}" y="${y.toFixed(1)}" text-anchor="end" font-size="9" fill="#9BB5B1" dominant-baseline="middle">${fmt$(v)}</text>`;
  });

  data.forEach((d,i)=>{
    const x=pad.l+gap*i+(gap-bW)/2;
    const barH=Math.abs(d.v)*scaleY;
    const y=d.v>=0?zeroY-barH:zeroY;
    const isPos=d.v>=0;
    let fill;
    if(d.forecast) fill=isPos?'url(#stripe-blue)':'url(#stripe-neg)';
    else           fill=isPos?'#3D9B8F':'#C0392B';
    const opacity=d.forecast?0.85:1;
    bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bW}" height="${Math.max(barH,1).toFixed(1)}" fill="${fill}" rx="2" opacity="${opacity}"/>`;
    // value label on non-zero bars
    if(Math.abs(d.v)>0){
      const labelY=isPos?y-2:y+barH+10;
      const col=isPos?'#1B7A3D':'#C0392B';
      vLabels+=`<text x="${(x+bW/2).toFixed(1)}" y="${labelY.toFixed(1)}" text-anchor="middle" font-size="8" fill="${col}" font-weight="600">${isPos?'+':''}${fmt$(d.v).replace('$','')}</text>`;
    }
    labels+=`<text x="${(x+bW/2).toFixed(1)}" y="${(H-pad.b+12).toFixed(1)}" text-anchor="middle" font-size="9" fill="${d.forecast?'#B0C8C4':'#7BA69E'}">${d.label}</text>`;
  });

  // Zero line
  const zLine=`<line x1="${pad.l}" y1="${zeroY.toFixed(1)}" x2="${W-pad.r}" y2="${zeroY.toFixed(1)}" stroke="#CBD9D6" stroke-width="1.5"/>`;
  // Divider after last actual
  const divX=pad.l+gap*(opts.lastActIdx+1);
  const divLine=opts.lastActIdx>=0&&opts.lastActIdx<11
    ?`<line x1="${divX.toFixed(1)}" y1="${pad.t}" x2="${divX.toFixed(1)}" y2="${H-pad.b}" stroke="#D4E2DD" stroke-width="1" stroke-dasharray="3,3"/><text x="${(divX+3).toFixed(1)}" y="${(pad.t+8).toFixed(1)}" font-size="8" fill="#A8C5BE">forecast ▶</text>`
    :'';

  return `<svg class="bar-chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${defs}${gridLines}${zLine}${bars}${vLabels}${labels}${divLine}</svg>`;
}

// ── Email-safe HTML builder (table-based layout, no SVG — for clipboard) ─────
let _emailHTML = '';

function _et(l,r){  // email two-column table
  return `<table width="100%" cellspacing="0" cellpadding="0" border="0" style="margin-bottom:20px"><tr>
    <td width="50%" style="vertical-align:top;padding-right:8px">${l}</td>
    <td width="50%" style="vertical-align:top;padding-left:8px">${r}</td>
  </tr></table>`;
}
function _eg(cells,cols){ // email KPI grid table
  const w=Math.floor(100/cols)+'%';
  return `<table width="100%" cellspacing="0" cellpadding="0" border="0" style="margin-bottom:14px"><tr>${
    cells.map((c,i)=>`<td width="${w}" style="vertical-align:top${i<cols-1?';padding-right:8px':''}">${c}</td>`).join('')
  }</tr></table>`;
}
function _em(data){ // email monthly data table (replaces SVG charts)
  const lr=data.map(d=>`<td style="font-size:9px;text-align:center;color:${d.forecast?'#B0C8C4':'#7BA69E'};padding:3px 1px;white-space:nowrap">${d.label}</td>`).join('');
  const vr=data.map(d=>{const p=d.v>=0,nz=Math.abs(d.v)>0;const c=p?'#1B7A3D':'#C0392B';return`<td style="font-size:10px;font-weight:700;text-align:center;color:${c};opacity:${d.forecast?.65:1};padding:2px 1px;white-space:nowrap">${nz?(p?'+':'')+fmt$(d.v):'—'}</td>`;}).join('');
  return `<table width="100%" cellspacing="0" cellpadding="0" border="0" style="margin-top:10px;border-top:1px solid #EDF2F1;padding-top:6px"><tr>${lr}</tr><tr>${vr}</tr></table>`;
}
function _ekm(lbl,val,sub,accent,vs=''){
  const bg=accent?'background:linear-gradient(135deg,#1B4D4A,#3D9B8F)':'background:#F6FAF9';
  const lc=accent?'rgba(255,255,255,.6)':'#7BA69E',vc=accent?'#fff':'#0D2B29',sc=accent?'rgba(255,255,255,.5)':'#9BB5B1';
  return `<div style="${bg};border-radius:8px;padding:12px 14px"><div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:${lc};margin-bottom:4px">${lbl}</div><div style="font-size:18px;font-weight:800;color:${vc};letter-spacing:-.02em;${vs}">${val}</div><div style="font-size:11px;color:${sc};margin-top:2px">${sub}</div></div>`;
}

      const pYE=sc?sc.projYearEnd:projYearEnd, rGN=sc?sc.runwayGoesNeg:runwayGoesNeg, rMos=sc?sc.runwayMonths:runwayMonths, cN=sc?sc.cashNeededYE:cashNeededYE;

      const cPBars=cP.map((v,i)=>({label:MN[i].slice(0,3),v:Math.round(v),forecast:i>lastActIdx}));
      const pad3=idx===0?'0 6px 0 0':idx===1?'0 3px 0 3px':'0 0 0 6px';
      return `<td width="33.33%" style="vertical-align:top;padding:${pad3}">

          ${_eg([_ekm('Projected YE',fmt$(pYE),`Dec 31, ${QBO_YEAR}`,false,`color:${pYE>=0?'#1B7A3D':'#C0392B'}`),_ekm('Cash Needed',cN>0?fmt$(cN):'None','to stay positive',false,`color:${cN>0?'#C0392B':'#1B7A3D'}`)],2)}
          ${_em(cPBars)}<div style="${NOTE}">Monthly ending cash — light = forecast</div>

    }).join('')}
    </tr></table>
    <div style="${FT}">RacquetX · Weekly Flash Report · Confidential &amp; Proprietary · Live: HubSpot + QuickBooks Online · ${new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}</div>
  </div>
</div>`;

async function copyForEmail(){
  if(!_emailHTML){alert('Report is still loading, please wait a moment.');return;}
  const btn=document.getElementById('copyEmailBtn');
  const reset=()=>{if(btn){btn.textContent='📋 Copy for Email';btn.style.background='rgba(255,255,255,.12)';btn.style.color='#fff';}};
  try{
    await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([_emailHTML],{type:'text/html'}),'text/plain':new Blob(['Weekly Flash Report — RacquetX'],{type:'text/plain'})})]);
    if(btn){btn.textContent='✓ Copied!';btn.style.background='#D4F0E8';btn.style.color='#1B6B55';}
    setTimeout(reset,2500);
  }catch(e){
    // Fallback: render into a hidden div, select it, copy via execCommand
    const wrap=document.createElement('div');
    wrap.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';
    wrap.innerHTML=_emailHTML;
    document.body.appendChild(wrap);
    const r=document.createRange();r.selectNode(wrap);
    const sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);
    try{document.execCommand('copy');}catch(e2){}
    sel.removeAllRanges();document.body.removeChild(wrap);
    if(btn){btn.textContent='✓ Copied!';btn.style.background='#D4F0E8';btn.style.color='#1B6B55';}
    setTimeout(reset,2500);
  }
}

  KPI:   'background:#F6FAF9;border-radius:8px;padding:12px 14px',
  KPI_A: 'background:linear-gradient(135deg,#1B4D4A,#3D9B8F);border-radius:8px;padding:12px 14px',
  LBL:   'font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#7BA69E;margin-bottom:4px',
  LBL_A: 'font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:rgba(255,255,255,.6);margin-bottom:4px',
  VAL:   'font-size:20px;font-weight:800;color:#0D2B29;letter-spacing:-.02em',
  VAL_A: 'font-size:20px;font-weight:800;color:#fff;letter-spacing:-.02em',
  SUB:   'font-size:11px;color:#9BB5B1;margin-top:2px',
  SUB_A: 'font-size:11px;color:rgba(255,255,255,.5);margin-top:2px',
  STITLE:'font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#7BA69E;margin-bottom:10px;margin-top:0',
  NOTE:  'font-size:10px;color:#9BB5B1;margin-top:6px;text-align:center',
  FOOTER:'text-align:center;font-size:11px;color:#9BB5B1;padding-top:20px;border-top:1px solid #E0ECEB;margin-top:8px',
  LIVE:  'background:#D4F0E8;color:#1B6B55;font-size:10px;font-weight:700;border-radius:4px;padding:2px 6px',
  ATT_ROW: 'display:flex;align-items:center;gap:10px;margin-bottom:10px',
  ATT_LBL: 'font-size:11px;font-weight:600;color:#2A4E4A;min-width:56px',
  ATT_BG:  'flex:1;height:8px;background:#EDF2F1;border-radius:4px;overflow:hidden',
  ATT_FILL:'height:100%;border-radius:4px',
  ATT_NUM: 'font-size:11px;min-width:140px;text-align:right',
  SL:    'display:flex;flex-direction:column',
  SI:    'display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #F0F6F4',
  SDOT:  'width:8px;height:8px;border-radius:50%;flex-shrink:0',
  SNAME: 'font-size:13px;font-weight:600;flex:1;color:#2A4E4A',
  SCT:   'font-size:12px;color:#7BA69E;min-width:50px;text-align:right',
  SRAW:  'font-size:13px;font-weight:700;color:#0D2B29;min-width:80px;text-align:right',
  SWTD:  'font-size:12px;color:#3D9B8F;min-width:70px;text-align:right',
  STOT:  'display:flex;align-items:center;gap:10px;padding:10px 0 0;border-top:2px solid #D4E2DD;margin-top:4px',
};
// KPI mini card with full inline styles (email-safe)
function kmi(lbl,val,sub,accent,vs=''){
  const b=accent?C.KPI_A:C.KPI, l=accent?C.LBL_A:C.LBL, v=accent?C.VAL_A:C.VAL, s=accent?C.SUB_A:C.SUB;
  return `<div style="${b}"><div style="${l}">${lbl}</div><div style="${v};${vs}">${val}</div><div style="${s}">${sub}</div></div>`;
}

function render(deals27all, cfData, bsData, forecastData, plData, hsTsLabel){
  const ci = curIdx();
  const content = document.getElementById('reportContent');

  // ── HubSpot: closed won
  const wonDeals = deals27all.filter(d => d.s==='closedwon' && d.a>0);
  let totSp=0, rbRev=0, nwRev=0, rbCt=0, nwCt=0;
  const firms = new Set(), rbFirms = new Set(), nwFirms = new Set();
  const monthly = Array(12).fill(null).map(()=>({v:0,cs:0}));
  wonDeals.forEach(d=>{
    totSp += d.a;
    const key = ck(d.n);
    firms.add(key);
    const idx = sc27Idx(d.cd); if(idx>=0&&idx<=11) monthly[idx].v += d.a;
    if(isRebook(d)){ rbCt++; rbRev+=d.a; rbFirms.add(key); }
    else { nwCt++; nwRev+=d.a; nwFirms.add(key); }
  });

  // ── HubSpot: open pipeline
  const openDeals = deals27all.filter(d => d.s!=='closedwon' && d.s!=='closedlost');
  let pipeRaw=0, pipeWtd=0;
  const byStage={};
  openDeals.forEach(d=>{
    const cfg = STAGE_CFG[d.s]||{prob:0.05,label:d.s,color:'#9BB5B1'};
    pipeRaw += (d.a||0);
    pipeWtd += (d.a||0) * cfg.prob;
    if(!byStage[d.s]) byStage[d.s]={raw:0,wtd:0,ct:0,firms:new Set()};
    byStage[d.s].raw += (d.a||0);
    byStage[d.s].wtd += (d.a||0)*cfg.prob;
    byStage[d.s].ct++;
    byStage[d.s].firms.add(ck(d.n));
  });

  // ── Quota attainment YTD
  const ytdActShow = monthly.slice(0,ci+1).reduce((s,m)=>s+m.v,0);
  const ytdQ       = Q_SHOW.slice(0,ci+1).reduce((s,v)=>s+v,0) + Q_CS.slice(0,ci+1).reduce((s,v)=>s+v,0);
  const annQ       = Q_SHOW.reduce((s,v)=>s+v,0) + Q_CS.reduce((s,v)=>s+v,0);
  const ytdPct     = pct(totSp, ytdQ);
  const attCol     = ytdPct>=100?'#1B7A3D':ytdPct>=75?'#1B4D4A':ytdPct>=50?'#B8860B':'#C0392B';

  // ── QBO: net cash changes
  const netChanges  = parseNetChanges(cfData?.report) || Array(12).fill(0);
  const bankBals    = extractBankBalances(bsData?.report) || Array(12).fill(0);
  const lastActIdx  = netChanges.reduce((idx,v,i)=>Math.abs(v)>0.01?i:idx, -1);
  const curCash     = lastActIdx >= 0 ? bankBals[lastActIdx] : 0;
  const beginCash   = bankBals[0] - (netChanges[0]||0);
  const cashChange  = curCash - beginCash;
  const avgBurn3    = lastActIdx >= 0 ? netChanges.slice(Math.max(0,lastActIdx-2), lastActIdx+1).reduce((s,v)=>s+v,0) / Math.min(3, lastActIdx+1) : 0;

  // ── Effective forecast: saved ?? trailing-avg fallback (mirrors index.html Downside) ──
  const plLines   = parsePlForCfLines(plData?.report);
  const suggested = {};
  CF_LINES.forEach(l => { suggested[l.key] = cfTrailingAvg(plLines[l.key] || Array(12).fill(0), lastActIdx); });
  const effectiveForecast = {};
  CF_LINES.forEach(l => {
    effectiveForecast[l.key] = Array(12).fill(0);
    for(let i = lastActIdx+1; i < 12; i++){
      const sv = forecastData?.[l.key]?.[i];
      effectiveForecast[l.key][i] = (sv != null) ? sv : suggested[l.key];
    }
  });

  // ── Forecast: build forecastBurns & cashPos ──
  const forecastBurns = Array(12).fill(0);
  // Past months: use actuals
  for(let i=0; i<=lastActIdx; i++) forecastBurns[i] = netChanges[i]||0;
  // Future months: effective forecast (saved ?? trailing avg per line)
  {
    const computedFuture = computeNetBurn(effectiveForecast);
    for(let i=Math.max(0,lastActIdx+1); i<12; i++) forecastBurns[i] = computedFuture[i];
  }
  // Cash position per month
  const cashPos = Array(12).fill(0);
  for(let i=0; i<12; i++){
    if(i<=lastActIdx) cashPos[i] = bankBals[i]||0;
    else cashPos[i] = (i===0?beginCash:cashPos[i-1]) + forecastBurns[i];
  }
  const projYearEnd = cashPos[11];
  // Runway: first future month where cashPos goes ≤ 0
  let runwayMonths = null, runwayGoesNeg = false;
  for(let i=lastActIdx+1; i<12; i++){
    if(cashPos[i] <= 0){ runwayMonths = i - lastActIdx; runwayGoesNeg = true; break; }
  }
  if(!runwayGoesNeg) runwayMonths = 12 - lastActIdx - 1; // months to year-end
  // Cash needed to stay positive through year-end
  const cashNeededYE = projYearEnd < 0 ? Math.abs(projYearEnd) : 0;

  // ── Scenario variants ──
  const baseScen = computeScenario(effectiveForecast, 0.5, netChanges, bankBals, beginCash, lastActIdx);
  const upScen   = computeScenario(effectiveForecast, 0,   netChanges, bankBals, beginCash, lastActIdx);

  const MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  // Monthly net change for bar chart (last 6 actual months)
  const burnBars = [];
  for(let i = Math.max(0, lastActIdx-5); i <= lastActIdx; i++){
    const mo = i < 9 ? `${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][i]}'26` : `${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][i]}'${QBO_YEAR%100}`;
    burnBars.push({ label: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][i], v: Math.round(netChanges[i]) });
  }

  // Cash balance bars (same period)
  const cashBars = [];
  for(let i = Math.max(0,lastActIdx-5); i <= lastActIdx; i++){
    cashBars.push({ label: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][i], v: Math.round(bankBals[i]) });
  }

  // ── Build HTML (all inline styles for email-safe copy-paste) ───────────────
  let h = '';

  // ─ Row 1: Sales KPIs + Pipeline ─
  h += `<div style="${C.TWO}">`;

  // Sales card
  h += `<div style="${C.CARD}">
    <div style="${C.TITLE}"><span>💰</span> SC2027 Closed Won <span style="${C.LIVE}">Live</span></div>
    <div style="${C.G3}">
      ${kmi('Total',fmt$(totSp),`${wonDeals.length} deals · ${firms.size} firms`,true)}
      ${kmi('Rebooks',rbCt,fmt$(rbRev))}
      ${kmi('New',nwCt,fmt$(nwRev))}
    </div>`;

  h += `<div style="margin-top:4px">`;
  MO_LBL.forEach((lbl, i) => {
    const q   = Q_SHOW[i] + Q_CS[i];
    const act = monthly[i].v;
    const isFut = i > ci;
    const p   = q > 0 ? Math.min(pct(act, q), 100) : 0;
    const c   = p >= 100 ? '#1B7A3D' : p >= 75 ? '#1B4D4A' : p >= 50 ? '#B8860B' : act > 0 ? '#C0392B' : '#D8E6E3';
    const attStr = !isFut && q > 0 ? `${p}% · ${act ? fmtFull(act) : '$0'} / ${fmtFull(q)}` : isFut ? `quota: ${fmtFull(q)}` : '—';
    h += `<div style="${C.ATT_ROW}">
      <div style="${C.ATT_LBL}">${lbl}</div>
      <div style="${C.ATT_BG}"><div style="${C.ATT_FILL};width:${isFut?0:p}%;background:${c};opacity:${isFut?.3:1}"></div></div>
      <div style="${C.ATT_NUM};color:${isFut?'#9BB5B1':c}">${attStr}</div>
    </div>`;
  });
  h += `</div>`;

  h += `<div style="margin-top:14px;padding-top:12px;border-top:1px solid #EDF2F1;display:flex;justify-content:space-between;align-items:center">
    <span style="font-size:12px;color:#5A8A84">YTD Attainment through ${MO_LBL[ci]}</span>
    <span style="font-size:15px;font-weight:800;color:${attCol}">${ytdPct}% <span style="font-size:11px;font-weight:400;color:#9BB5B1">of ${fmt$(ytdQ)} YTD quota</span></span>
  </div>`;
  h += `</div>`; // end sales card

  // Pipeline card
  h += `<div style="${C.CARD}">
    <div style="${C.TITLE}"><span>📋</span> SC2027 Pipeline</div>
    <div style="${C.G3}">
      ${kmi('Weighted',fmt$(pipeWtd),'prob-adjusted',true)}
      ${kmi('Raw',fmt$(pipeRaw),`${openDeals.length} open deals`)}
      ${kmi('Projected',fmt$(totSp+pipeWtd),'Won + weighted')}
    </div>
    <div style="${C.SL}">`;

  const stageOrder = Object.keys(STAGE_CFG);
  const activeStages = stageOrder.filter(s=>byStage[s]).concat(Object.keys(byStage).filter(s=>!STAGE_CFG[s]));
  activeStages.forEach(sid=>{
    const s=byStage[sid], cfg=STAGE_CFG[sid]||{prob:0.05,label:sid,color:'#9BB5B1'};
    const p=Math.round(cfg.prob*100);
    const probCol=p>=80?'#1B7A3D':p>=50?'#3D9B8F':p>=25?'#B8860B':'#9BB5B1';
    h+=`<div style="${C.SI}">
      <div style="${C.SDOT};background:${cfg.color}"></div>
      <div style="${C.SNAME}">${cfg.label}</div>
      <div style="font-size:10px;font-weight:700;padding:2px 5px;border-radius:3px;min-width:30px;text-align:center;background:${probCol}1A;color:${probCol}">${p}%</div>
      <div style="${C.SCT}">${s.ct} · ${s.firms.size}f</div>
      <div style="${C.SRAW}">${s.raw?fmtFull(s.raw):'TBD'}</div>
      <div style="${C.SWTD}">${fmtFull(Math.round(s.wtd))}</div>
    </div>`;
  });
  h+=`</div>
    <div style="${C.STOT}">
      <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#7BA69E;flex:1">Total</div>
      <div style="${C.SCT};color:#0D2B29;font-weight:700">${openDeals.length}</div>
      <div style="${C.SRAW};font-weight:700">${fmt$(pipeRaw)}</div>
      <div style="${C.SWTD};font-weight:700;color:#1B4D4A">${fmtFull(Math.round(pipeWtd))}</div>
    </div>
  </div>`; // end pipeline card

  h += `</div>`; // end two-col

  // ─ Row 2: Cash Position + Burn Rate ─
  h += `<div style="${C.STITLE}">Cash &amp; Burn — FY${QBO_YEAR}</div>`;
  h += `<div style="${C.TWO}">`;

  // Cash position card
  h += `<div style="${C.CARD}">
    <div style="${C.TITLE}"><span>🏦</span> Cash Position</div>
    <div style="${C.G3}">
      ${kmi('Current Balance',fmt$(curCash),lastActIdx>=0?`End of ${MN[lastActIdx]} ${QBO_YEAR}`:'No data',true)}
      ${kmi('Jan 1 Balance',fmt$(beginCash),`Beginning ${QBO_YEAR}`)}
      ${kmi('YTD Change',`${cashChange>=0?'+':''}${fmt$(cashChange)}`,'vs Jan 1',false,`color:${cashChange>=0?'#1B7A3D':'#C0392B'}`)}
    </div>`;

  if(cashBars.length > 0){
    h += `<div style="width:100%;overflow:hidden">${svgBars(cashBars, {h:100, posColor:'#3D9B8F', negColor:'#C0392B'})}</div>`;
    h += `<div style="${C.NOTE}">Monthly ending cash balance (bank accounts)</div>`;
  }
  h += `</div>`; // end cash card

  // Burn rate card
  h += `<div style="${C.CARD}">
    <div style="${C.TITLE}"><span>🔥</span> Monthly Net Cash Flow</div>
    <div style="${C.G3}">
      ${kmi('Latest Month',lastActIdx>=0?fmt$(netChanges[lastActIdx]):'—',lastActIdx>=0?MN[lastActIdx]+' '+QBO_YEAR:'—',true,lastActIdx>=0&&netChanges[lastActIdx]<0?'color:#ff8a7a':'')}
      ${kmi('3-mo Avg',`${avgBurn3>=0?'+':''}${fmt$(avgBurn3)}`,'trailing average',false,`color:${avgBurn3>=0?'#1B7A3D':'#C0392B'}`)}
      ${kmi('Trend',avgBurn3>=0?'📈 Positive':'📉 Negative',avgBurn3>=0?'Cash generating':'Cash consuming')}
    </div>`;

  if(burnBars.length > 0){
    h += `<div style="width:100%;overflow:hidden">${svgBars(burnBars, {h:100})}</div>`;
    h += `<div style="${C.NOTE}">Net cash in/out per month — green = inflow, red = outflow</div>`;
  } else {
    h += `<div style="text-align:center;padding:20px;font-size:13px;color:#9BB5B1">No cash flow data available</div>`;
  }
  h += `</div>`; // end burn card
  h += `</div>`; // end two-col

  // ─ Cash Forecast & Runway — Downside ─
  h += `<div style="${C.STITLE};margin-top:24px">Cash Forecast &amp; Runway — Downside Scenario — FY${QBO_YEAR}</div>`;

  // Flag banner
  const flagLevel = runwayGoesNeg ? 'red' : (projYearEnd < curCash * 0.25 ? 'amber' : 'green');
  const flagIcon  = runwayGoesNeg ? '🚨' : (flagLevel==='amber' ? '⚠️' : '✅');
  const flagBg    = {red:'background:#FFF0EE;border:2px solid #E74C3C', amber:'background:#FFFBF0;border:2px solid #F39C12', green:'background:#F0FAF4;border:2px solid #1B7A3D'};
  const flagTc    = {red:'#C0392B', amber:'#B8860B', green:'#1B7A3D'};
  let flagTitle, flagDetail;
  if(runwayGoesNeg){
    flagTitle  = `Cash Runway Alert — projected shortfall in ${runwayMonths} month${runwayMonths!==1?'s':''}`;
    flagDetail = `At the current forecast burn rate, cash is projected to reach <strong>$0 by ${MN[lastActIdx+runwayMonths]} ${QBO_YEAR}</strong>.
      Year-end balance: <strong style="color:#C0392B">${fmtFull(projYearEnd)}</strong>.
      Additional cash needed to reach Dec 31: <strong style="color:#C0392B">${fmtFull(cashNeededYE)}</strong>.`;
  } else if(flagLevel==='amber'){
    flagTitle  = `Caution — cash declining toward year-end`;
    flagDetail = `Projected year-end balance: <strong>${fmtFull(projYearEnd)}</strong> vs current <strong>${fmtFull(curCash)}</strong>.
      No shortfall projected, but buffer is thinning. Monitor closely through ${MN[11]} ${QBO_YEAR}.`;
  } else {
    flagTitle  = `Cash Position Healthy Through Year-End`;
    flagDetail = `Projected year-end balance: <strong>${fmtFull(projYearEnd)}</strong>. No cash shortfall expected through Dec 31, ${QBO_YEAR}.`;
  }
  h += `<div style="border-radius:12px;padding:18px 22px;margin-bottom:24px;display:flex;align-items:flex-start;gap:16px;${flagBg[flagLevel]}">
    <div style="font-size:28px;flex-shrink:0;line-height:1">${flagIcon}</div>
    <div>
      <div style="font-size:15px;font-weight:800;margin-bottom:4px;color:${flagTc[flagLevel]}">${flagTitle}</div>
      <div style="font-size:13px;line-height:1.55;color:#2A4E4A">${flagDetail}</div>
    </div>
  </div>`;

  // Forecast KPIs + charts
  h += `<div style="${C.TWO}">`;
  h += `<div style="${C.CARD}">
    <div style="${C.TITLE}"><span>📈</span> Full-Year Cash Position Forecast</div>
    <div style="${C.G4}">
      ${kmi('Current',fmt$(curCash),`End of ${MN[lastActIdx]}`,true)}
      ${kmi('Projected YE',fmt$(projYearEnd),`Dec 31, ${QBO_YEAR}`,false,`color:${projYearEnd>=0?'#1B7A3D':'#C0392B'}`)}
      ${kmi('Cash Needed',cashNeededYE>0?fmtFull(cashNeededYE):'None','to stay positive',false,`color:${cashNeededYE>0?'#C0392B':'#1B7A3D'}`)}
      ${kmi('Runway',runwayGoesNeg?runwayMonths+'mo':'> YE',runwayGoesNeg?'until $0':'through Dec',false,`color:${runwayGoesNeg?'#C0392B':'#1B7A3D'}`)}
    </div>`;

  const cashPosBars = cashPos.map((v,i)=>({ label:MN[i].slice(0,3), v:Math.round(v), forecast:i>lastActIdx }));
  h += `<div style="width:100%;overflow:hidden">${svgBarsActVsForecast(cashPosBars, {h:110, lastActIdx})}</div>`;
  h += `<div style="${C.NOTE}">Monthly ending cash balance — solid = actuals, hatched = forecast</div>`;
  h += `</div>`; // end card

  h += `<div style="${C.CARD}">
    <div style="${C.TITLE}"><span>🔥</span> Monthly Burn Rate — Actuals &amp; Forecast</div>
    <div style="${C.G3}">
      ${kmi('3-mo Avg Burn',`${avgBurn3>=0?'+':''}${fmt$(avgBurn3)}`,'trailing actual',true,avgBurn3<0?'color:#ff8a7a':'')}
      ${kmi('Remaining Mos',12-lastActIdx-1,'to forecast')}
      ${(()=>{const fSum=forecastBurns.slice(lastActIdx+1).reduce((s,v)=>s+v,0);return kmi('Forecast YTD-YE',fmt$(fSum),'net change thru Dec',false,`color:${fSum>=0?'#1B7A3D':'#C0392B'}`);})()}
    </div>`;

  const burnForecastBars = forecastBurns.map((v,i)=>({ label:MN[i].slice(0,3), v:Math.round(v), forecast:i>lastActIdx }));
  h += `<div style="width:100%;overflow:hidden">${svgBarsActVsForecast(burnForecastBars, {h:110, lastActIdx, zeroBased:true})}</div>`;
  h += `<div style="${C.NOTE}">Net cash in/out per month — solid = actuals, hatched = forecast</div>`;
  h += `</div>`; // end card
  h += `</div>`; // end two-col

  // ─ Scenario Comparison ─
  h += `<div style="${C.STITLE};margin-top:28px">Scenario Comparison — FY${QBO_YEAR}</div>`;
  const scenDefs = [
    { key:'down', label:'↓ Downside', desc:'Full contingencies as entered', icon:'📉', border:'#C0392B', scen:null },
    { key:'base', label:'◆ Base',     desc:'Contingencies at 50% of Downside', icon:'📊', border:'#1B4D4A', scen:baseScen },
    { key:'up',   label:'↑ Upside',   desc:'Zero contingencies — hitting sales quota', icon:'🚀', border:'#1B7A3D', scen:upScen },
  ];
  h += `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px">`;
  scenDefs.forEach(({label,desc,icon,border,scen:sc})=>{
    const pYE  = sc ? sc.projYearEnd  : projYearEnd;
    const rGN  = sc ? sc.runwayGoesNeg : runwayGoesNeg;
    const rMos = sc ? sc.runwayMonths  : runwayMonths;
    const cN   = sc ? sc.cashNeededYE  : cashNeededYE;
    const cP   = sc ? sc.cashPos       : cashPos;
    const statusTxt = rGN ? `🚨 Shortfall in ${rMos}mo` : (pYE < curCash*0.25 ? '⚠️ Buffer thinning' : '✅ Healthy through YE');
    const statusC   = rGN ? '#C0392B' : (pYE < curCash*0.25 ? '#B8860B' : '#1B7A3D');
    const cpBars = cP.map((v,i)=>({ label:MN[i].slice(0,3), v:Math.round(v), forecast:i>lastActIdx }));
    h += `<div style="${C.CARD};border-top:3px solid ${border}">
      <div style="display:flex;align-items:center;gap:7px;margin-bottom:2px">
        <span style="font-size:15px">${icon}</span>
        <span style="font-size:13px;font-weight:800;color:#0D2B29">${label}</span>
      </div>
      <div style="font-size:11px;color:#7A9E9A;margin-bottom:12px">${desc}</div>
      <div style="${C.G3}">
        ${kmi('Projected YE',fmtFull(pYE),`Dec 31, ${QBO_YEAR}`,false,`color:${pYE>=0?'#1B7A3D':'#C0392B'}`)}
        ${kmi('Cash Needed',cN>0?fmtFull(cN):'None','to stay positive',false,`color:${cN>0?'#C0392B':'#1B7A3D'}`)}
        ${kmi('Status',rGN?rMos+'mo':'>YE',rGN?'until $0':'Healthy',false,`color:${statusC}`)}
      </div>
      <div style="width:100%;overflow:hidden">${svgBarsActVsForecast(cpBars, {h:90, lastActIdx})}</div>
      <div style="${C.NOTE}">Monthly ending cash — solid = actuals, hatched = forecast</div>
      <div style="margin-top:8px;font-size:11px;font-weight:700;color:${statusC}">${statusTxt}</div>
    </div>`;
  });
  h += `</div>`;

  h += `<div style="${C.FOOTER}">RacquetX · Weekly Flash Report · Confidential &amp; Proprietary · Live: HubSpot + QuickBooks Online · ${new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}</div>`;

  content.innerHTML = h;

  // Build email-safe HTML for clipboard copy
  _emailHTML = buildEmailHTML({
    wonDeals, totSp, firms, rbCt, rbRev, nwCt, nwRev, monthly, ci, attCol, ytdPct, ytdQ,
    pipeWtd, pipeRaw, openDeals, byStage,
    curCash, beginCash, cashChange, avgBurn3, netChanges, lastActIdx,
    cashBars, burnBars, runwayGoesNeg, runwayMonths,
    projYearEnd, cashNeededYE, cashPos, forecastBurns,
    baseScen, upScen,
    MN, QBO_YEAR
  });

  // Header
  document.getElementById('weekBadge').textContent = weekLabel();
  document.getElementById('asOfDate').textContent   = new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
  document.getElementById('syncLine').textContent   = hsTsLabel ? `HubSpot synced: ${hsTsLabel}` : 'Live data loaded';
}

// ── Fetch & init ─────────────────────────────────────────────────────────────
async function init(){
  const fetchQbo = path => fetch(QBO_BASE+path,{cache:'no-store',signal:AbortSignal.timeout(20000)}).then(r=>r.ok?r.json():Promise.reject('HTTP '+r.status));

  try {
    const [hsRes, cfRes, bsRes, fcRes, plRes] = await Promise.allSettled([
      fetch(HS_PROXY,{cache:'no-store',signal:AbortSignal.timeout(15000)}).then(r=>r.json()),
      fetchQbo(`/api/cashflow?year=${QBO_YEAR}`),
      fetchQbo(`/api/balancesheet?year=${QBO_YEAR}`),
      fetchQbo(`/api/forecast?year=${QBO_YEAR}`),
      fetchQbo(`/api/pl?year=${QBO_YEAR}`)
    ]);

    const hsData = hsRes.status==='fulfilled' ? hsRes.value : null;
    const cfData = cfRes.status==='fulfilled' ? cfRes.value : null;
    const bsData = bsRes.status==='fulfilled' ? bsRes.value : null;
    const fcRaw  = fcRes.status==='fulfilled' ? fcRes.value : null;
    const fcData = fcRaw?.forecast || null;
    const plData = plRes.status==='fulfilled' ? plRes.value : null;

    if(!hsData?.d) throw new Error('HubSpot data unavailable');

    const deals27 = hsData.d.filter(d => d.p===27);
    render(deals27, cfData, bsData, fcData, plData, hsData.ts||'');
  } catch(err){
    document.getElementById('reportContent').innerHTML =
      `<div style="background:#FFF5F5;border:1px solid #FCC;border-radius:12px;padding:20px 24px;color:#C0392B;font-size:13px;">
        ⚠️ Failed to load report data: ${err.message}. Please refresh.
      </div>`;
    document.getElementById('syncLine').textContent = 'Load failed';
  }
}

init();
</script>
